name: Bygg og publiser

# Ny versjon: auk __version__ i froditor/__init__.py og push til main.
# Finst det ikkje ein release for versjonen frå før, blir han bygd og publisert,
# og taggen (t.d. v1.2.0) blir laga automatisk. Ein tag pusha for hand fungerer òg.
on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Installer avhengigheiter
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 xvfb
      - name: Køyr testar
        env:
          GSK_RENDERER: cairo
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -t . -v

  release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Finn versjon og sjekk om han er ny
        id: check
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(python3 -c 'import froditor; print(froditor.__version__)')"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            EXISTS=true
          else
            EXISTS=false
          fi
          echo "RELEASE_EXISTS=$EXISTS" >> "$GITHUB_ENV"
          # Manuell køyring publiserer alltid nettsida på nytt; elles berre nye versjonar.
          if [[ "$EXISTS" == false || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publiserer versjon $VERSION"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Versjon $VERSION er alt publisert – ingenting å gjere."
          fi

      - name: Installer verktøy
        if: steps.check.outputs.publish == 'true'
        run: sudo apt-get update && sudo apt-get install -y apt-utils dpkg-dev

      - name: Hent signeringsnøkkel
        if: steps.check.outputs.publish == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "::error::Manglar hemmelegheita GPG_PRIVATE_KEY. Sjå README (Førstegongsoppsett)."
            exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          echo "GPG_KEY=$KEY" >> "$GITHUB_ENV"
          gpg --export "$KEY" > "$RUNNER_TEMP/froditor-archive-keyring.gpg"

      - name: Bygg .deb
        if: steps.check.outputs.publish == 'true'
        run: KEYRING="$RUNNER_TEMP/froditor-archive-keyring.gpg" packaging/build-deb.sh "$VERSION"

      - name: Bygg APT-kjelde
        if: steps.check.outputs.publish == 'true'
        run: packaging/build-apt-repo.sh site "$GPG_KEY" dist/*.deb

      - name: Last opp til GitHub Pages
        if: steps.check.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Lag GitHub-release og tag
        if: steps.check.outputs.publish == 'true' && env.RELEASE_EXISTS == 'false'
        run: >
          gh release create "v$VERSION" dist/*.deb
          --target "$GITHUB_SHA" --title "Froditor $VERSION" --generate-notes

  deploy:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
